server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # When a reverse proxy on a private network (Caddy in deploy/, or the
    # host's own) stands in front, take the visitor's address from its
    # X-Real-IP; otherwise every request would look like the proxy's and
    # the backend's login rate limit would lump all visitors together.
    # A visitor coming straight from the internet cannot set it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    # Prize photos are uploaded at up to 5 MB.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        proxy_pass http://backend:8080/media/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
