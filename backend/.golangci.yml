version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - gocritic
    - errorlint
    - bodyclose
    - noctx
    - misspell
    - prealloc
  exclusions:
    paths:
      - internal/repository/db # sqlc-generated code

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - internal/repository/db # sqlc-generated code
